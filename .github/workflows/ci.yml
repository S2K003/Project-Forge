name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, publish web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish ForgeOps.Web (static)
        run: dotnet publish src/ForgeOps.Web/ForgeOps.Web.csproj -c Release -o artifacts/web --no-build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgeops-web
          path: artifacts/web/wwwroot
          if-no-files-found: error
